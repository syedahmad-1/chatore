version: '3.9'

services:
  postgres:
    image: postgres:16
    container_name: chatore-postgres

    deploy:
      resources:
        limits:
          memory: 300M
        reservations:
          memory: 150M

    environment:
      POSTGRES_DB: chatore
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    # Tell Postgres to use less memory internally
    command: >
      postgres 
      -c shared_buffers=64MB 
      -c max_connections=20 
      -c work_mem=4MB