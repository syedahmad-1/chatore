server:
  port: 8081

spring:
  application:
    name: auth-service

  datasource:
    # Changed localhost to postgres-db and appended the timezone option
    url: jdbc:postgresql://localhost:5432/chatore
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect